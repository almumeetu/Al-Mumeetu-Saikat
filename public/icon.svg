<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="amsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c10" />
      <stop offset="50%" stop-color="#052319" />
      <stop offset="100%" stop-color="#02140e" />
    </linearGradient>
    <linearGradient id="amsStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amsAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="60%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="amsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(52, 211, 153, 0.5)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.12)" />
    </linearGradient>
    <filter id="amsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(16, 185, 129, 0.35)" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="1.5" y="1.5" width="45" height="45" rx="13" fill="url(#amsBg)" stroke="url(#amsBorder)" stroke-width="1.5" />

  <!-- A-Frame Structure (Architectural Chevron) -->
  <path d="M13.5 35 L24 13 L34.5 35" stroke="url(#amsStroke)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#amsGlow)" />

  <!-- S-Curve Dynamic Weave: loops through crossbar forming the 'S' of Saikat -->
  <path d="M31.5 20.5 C27.5 17 21 18.5 21 23 C21 27.5 27 27 27 31.5 C27 35 22 36 16.5 33.5" stroke="url(#amsAccent)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Core Precision Diamond -->
  <polygon points="24,19 26,22 24,25 22,22" fill="#34d399" opacity="0.9" />
</svg>